<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Swap</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Skill Swap</h1>
        <nav>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Browse Skills</a></li>
                <li><a href="#">Offer Skills</a></li>
                <li><a href="#">About</a></li>

            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h2>Learn from students or teach your skill. </h2>
            <p>Affortable Tutoring</p>
            <a href="#" class="button">Find a Tutor</a>
        </section>
        <section class="skill-offerings">
            <h2>Search Skills</h2>
            <div class="filter-buttons">
                <button class="filter-btn" data-category="All">All</button>
                <button class="filter-btn" data-category="Programming">Programming</button>
                <button class="filter-btn" data-category="Music">Music</button>
                <button class="filter-btn" data-category="Career">Career</button>
            </div>
            <div class="skills-grid" id="skill-grid">
            </div>
        </section>

    </main>
    <footer>
        <h2> 2026 Skill Swap</h2>
        <nav class="footer-links">
            <a href="#">Home</a>
            <a href="#">Browse Skills</a>
            <a href="#">Offer Skills</a>
            <a href="#">About</a>
        </nav>
    </footer>
    <script src="skillswap-functions.js"></script>
    <script src="script.js"></script>
</body>

</html>
